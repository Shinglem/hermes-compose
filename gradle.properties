# ============================================================================
#  hermes-compose · Gradle 属性
#  ---------------------------------------------------------------------------
#  代理：本机实测 GitHub 需代理、Maven 国内镜像可直连。
#  默认**不开**代理（走阿里云镜像）；需要时用命令行临时开：
#     ./gradlew build -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890
#  或取消下面两行注释。不要提交个人代理端口前先确认仓库受众。
# ============================================================================

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# 依赖解析失败时给更明确的信息
org.gradle.warning.mode=all

# --- 代理（按需启用）---
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|maven.aliyun.com|mirrors.cloud.tencent.com|repo.huaweicloud.com

# --- 终端 ---
# 终端已拆到 `:modules:terminal`（宿主）+ `:modules:terminal-bossterm`（BossTerm 裁剪 fork，
# composite build），依赖始终参与构建，不再有开关。
# 保留此注释是为了让后来者知道：曾经有过 `hermes.terminal`，已随 ADR-044 移除。
