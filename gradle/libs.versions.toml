# ============================================================================
#  hermes-compose · 版本目录（唯一版本来源）
#  ---------------------------------------------------------------------------
#  规则（见 .design/详细设计/工程与代码/02-依赖与版本.md）：
#   · 版本只在这里出现一次；模块脚本不写版本号
#   · CMP 内部件（compose.runtime / material3 / desktop.currentOs / uiTest …）
#     由 Compose 插件提供，**不进本文件**
#   · 预览版（-alpha/-beta/-rc）不得进 [versions]，除非已有 ADR
#   · 核对时间：2026-10-26，来源 repo1.maven.org maven-metadata.xml
# ============================================================================

[versions]
# 语言与构建
kotlin = "2.4.21"
compose = "1.12.2"

# 运行时
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.12.0"
# 注意：material3 1.9.0 传递依赖 kotlinx-datetime 0.7.1，与本项一起解析到
# 官方 compat 变体 0.8.0-0.6.x-compat（保留 0.6 的 Instant 等 API）。
# 这里直接写解析结果，避免"写的 0.8.0、跑的是别的"。
datetime = "0.8.0-0.6.x-compat"
settings = "1.3.0"

# 网络
ktor = "3.6.1"

# 日志（AGENTS.md §2 允许的少量新增）：kotlin-logging 做门面，桌面端由 logback 落盘。
# 版本核对时间：2026-10-28，来源 search.maven.org（kotlin-logging-jvm 7.0.7 / logback-classic 1.5.18）。
kotlin-logging = "8.0.4"
logback = "1.6.6"
# Nucleus 通知模块：WinRT Toast（原生按钮）。核对 2026-11-04，repo1.maven.org；MIT。
nucleus = "2.5.18"
# 注：内嵌浏览器（CEF）已于 v0.4.1 移除，
# HTML 块改由 markdown-one 的原生渲染（ksoup 清洗 + Compose 块树）处理。

# 渲染与资源
# Canvas 三窗格（M3 canonical list-detail）。
# adaptive-layout 提供 ListDetailPaneScaffold（含 extraPane 第三槽）与 AnimatedPane；
# adaptive-navigation 提供 rememberListDetailPaneScaffoldNavigator。
# 两者都不依赖 material3，只依赖 foundation/ui/animation —— 与 material3 版本解耦。
# 注意：NavigableListDetailPaneScaffold 只有 Android 侧有，CMP desktop 未移植，
# 用 navigator + ListDetailPaneScaffold 等价实现（ADR-037）。
adaptive = "1.3.0"

# ============================================================================
#  v0.6.0 架构基座（ADR-057）：Decompose + MVIKotlin + Koin
#  ---------------------------------------------------------------------------
#  版本核对：2026-11-13，repo1.maven.org maven-metadata.xml
#    decompose 3.6.0 / 3.6.1 / 3.6.2（Apache-2.0）；3.6.2 发布于 2026-11-10
#    mvikotlin 4.4.0（Apache-2.0）
#    koin      4.2.2（Apache-2.0）
#  · decompose 3.6.x 依赖 Essenty 2.7.1 + kotlinx-serialization-core 1.6.3 + kotlin-stdlib 2.3.21
#    → 本项目取高：serialization 1.12.0 / kotlin 2.4.21（S0 已编译验证通过）
#  · **已知版本交叉已验证**：mvikotlin 4.4.0 编译于 Essenty 2.5.0，decompose 要 2.7.1；
#    Gradle 解析到 2.7.1，`RefactorBaseSpikeTest` 在真实 2.7.1 上跑通（5 个用例全绿）。
#  · MVIKotlin 官方：与 decompose 是同一作者在 Essenty 之上的两层，互不排斥。
#  · **坑**：mvikotlin 核心 jar 只有接口；DefaultStore / DefaultStoreFactory 在
#    `mvikotlin-main` 里 → 生产代码必须依赖它（不能只放 commonTest）。
# ============================================================================
decompose = "3.6.2"
mvikotlin = "4.4.0"
koin      = "4.2.2"

# 桌面窗口壳（ADR-062）：3.0 已删除全部 AWT 后端，只剩 Tao。
# 只有 3.0.0-dev-* 可用，末版 202611061347（2026-11-06）。接受 dev 版。
# 关键实证（读 `NucleusApplication.kt` 源码）：`nucleusApplication(enableSingleInstance = false)`
# 是**公开参数**，默认 `!ExecutableRuntime.isDev()` —— 可以关掉，让位给自研 CreateMutexW。
nucleus-app = "3.0.0-dev-202611061347"
# 托盘：2.1.0 起与 `-app` 拆分，只引本体。与 Tao 3.0 的兼容性待 S6 实测。
composenativetray = "2.1.7"

# WebView（ADR-078）：**Nucleus 官方 WebView 构件**，独立发版，MIT。
# 内部 = Windows 上 WebView2 CompositionController + Tao `NativeView`。
# 与 nucleus-app 3.0.0-dev 的符号兼容性已用 javap 核对（只引用 4 个 tao 符号，全部存在）。
composewebview = "1.0.3"

# 不可变集合：State 里的 List/Map 换成 Immutable*，否则每次 state 变更整树重组
# （现状 @Immutable 全仓仅 1 处）。0.5.x 有 copy 类方法重命名（add→adding 等，KEEP-0459），
# 见技能 kotlin-tooling-immutable-collections-0-5-x-migration。
kotlinx-collections-immutable = "0.5.2"

# 文件选择对话框（MIT，Kotlin Foundation Grants 资助）：替代 5 个 expect/actual。
# 0.17.0 仍是 pre-1.0；提权进程可用性待 S0 实测，不过就回退现有实现。
filekit = "0.17.0"

# 测试：验证 Store.state / Store.labels 的发射序列（"多发/少发"只有 awaitItem 能抓）。
turbine = "1.2.1"

# 终端：BossTerm 裁剪版以 git submodule + composite build 接入（modules/terminal-bossterm），
# 不再从这里声明坐标；PTY 由它内部的 pty4j 负责。

[libraries]
# --- AndroidX Lifecycle（JetBrains 的 KMP 移植）---
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- 协程 ---
kotlinx-coroutines-core  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

# --- 序列化 / 时间 / 偏好 ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
multiplatform-settings     = { module = "com.russhwolf:multiplatform-settings", version.ref = "settings" }

# --- Ktor（HTTP + WebSocket）---
ktor-client-core                = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio                 = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets          = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json         = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- 日志 ---
# commonMain 用 kotlin-logging 门面（multiplatform 变体，KMP 自动选 jvm）；
# desktopMain 用 logback-classic 提供 SLF4J 后端与滚动文件。
# Windows 原生通知（toast + 按钮）：native dll 打在 jar 里，由 core-runtime 的 NativeLibraryLoader 解压。
# 依赖只有 kotlin-stdlib，不拖整个 nucleus 框架。见 详细设计/工程与代码/12-通知窗.md。
nucleus-notification-windows = { module = "dev.nucleusframework:nucleus.notification-windows", version.ref = "nucleus" }
kotlin-logging  = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# --- Canvas 三窗格（M3 canonical list-detail）---
adaptive-layout     = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "adaptive" }
adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "adaptive" }

# --- Markdown ---
# 渲染实现来自 :modules:markdown-one（git submodule），依赖坐标写在它自己的
# build.gradle.kts 里 —— 子模块挂载后读的是本 catalog，条目必须保持存在，
# 但那边的依赖是字面量，所以这里不再登记 mikepenz / highlights / mermaid 的坐标。

# --- 图片（注意：ktor 集成模块名带 3）---

# --- 终端 ---
# BossTerm 裁剪版（modules/terminal-bossterm）经 composite build 提供，坐标不在版本目录里。

# --- Compose UI Test（显式坐标，避免 compose.uiTest 的实验性 opt-in）---
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }

# --- v0.6.0 架构基座（ADR-057；版本核对 2026-11-13，repo1.maven.org）---
decompose                  = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-extensions-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
mvikotlin                  = { module = "com.arkivanov.mvikotlin:mvikotlin", version.ref = "mvikotlin" }
mvikotlin-main             = { module = "com.arkivanov.mvikotlin:mvikotlin-main", version.ref = "mvikotlin" }
mvikotlin-extensions-coroutines = { module = "com.arkivanov.mvikotlin:mvikotlin-extensions-coroutines", version.ref = "mvikotlin" }
koin-core                  = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose               = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-test                  = { module = "io.insert-koin:koin-test", version.ref = "koin" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
filekit-dialogs-compose    = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
turbine                    = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# --- 桌面窗口壳（ADR-062；仅 desktopMain 用，且只有 shell/ 可引用）---
nucleus-application        = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus-app" }
nucleus-decorated-window-tao = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus-app" }
composenativetray          = { module = "dev.nucleusframework:composenativetray", version.ref = "composenativetray" }
# WebView（ADR-078）：Nucleus 官方 WebView，独立发版号；Windows 上是 WebView2 + NativeView。
composewebview             = { module = "dev.nucleusframework:composewebview", version.ref = "composewebview" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose              = { id = "org.jetbrains.compose", version.ref = "compose" }
