<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Hermes">
  <!--
    Hermes 客户端图标（唯一设计源）。

    形状刻意只有「圆角方底 + 三个矩形拼的 H」：16px（任务栏小图标）时细节会糊，
    任何曲线装饰都会变成灰点，所以不用文字字形、不用细线。
    与托盘图标（Main.kt 里的自绘 Painter）同一套几何。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#3B57D6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>
  <g fill="#FFFFFF">
    <rect x="76" y="72" width="24" height="112" rx="8" ry="8"/>
    <rect x="156" y="72" width="24" height="112" rx="8" ry="8"/>
    <rect x="100" y="116" width="56" height="24" rx="8" ry="8"/>
  </g>
</svg>
